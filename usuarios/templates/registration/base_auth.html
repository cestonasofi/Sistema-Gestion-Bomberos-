{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Operativo - Cuartel</title>
    <style>
        body {
            background-color: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #f1f1f1;
        }

        .login-card {
            background-color: #111111;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #3a3a3a;
        }

        .hazard-stripe {
            background: repeating-linear-gradient(45deg, #f59e0b, #f59e0b 12px, #0a0a0a 12px, #0a0a0a 24px);
            height: 12px;
            width: 100%;
        }

        .login-header {
            background-color: #0a0a0a;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #1c1c1c;
        }

        .login-header h2 {
            color: #ef4444;
            margin: 0;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-body {
            padding: 25px 30px;
        }

        .login-body p {
            color: #8b8b8b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #c9c9c9;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
            background-color: #0a0a0a;
            color: #f1f1f1;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #ef4444;
            outline: none;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }

        .btn-submit {
            width: 100%;
            background-color: #c1121f;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 14px;
            margin-top: 5px;
            transition: background-color 0.2s;
            text-decoration: none;
            text-align: center;
            display: block;
            box-sizing: border-box;
        }

        .btn-submit:hover {
            background-color: #b91c1c;
        }

        .btn-cancel {
            background-color: #1c1c1c;
            color: #c9c9c9;
            border: 1px solid #3a3a3a;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .btn-cancel:hover {
            background-color: #3a3a3a;
            color: white;
        }

        .success-msg {
            color: #5ee173;
            background-color: rgba(16, 185, 129, 0.1);
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            border-left: 3px solid #10b981;
            text-align: center;
            line-height: 1.6;
        }

        .success-msg a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
        }

        .success-msg a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="hazard-stripe"></div>
        <div class="login-header"><h2>{% block title %}{% endblock %}</h2></div>
        <div class="login-body">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
